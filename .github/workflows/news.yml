name: Telegram news (every 5 minutes)

on:
  # Bootstrap the relay automatically when this workflow is updated.
  push:
    paths:
      - '.github/workflows/news.yml'
  # Fallback: GitHub may delay or drop schedule events; relay below is primary.
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only check feeds, do not publish'
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
    steps:
      - name: Log trigger and schedule
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Scheduled expression: ${{ github.event.schedule }}"
          date -u "+Runner UTC: %Y-%m-%d %H:%M:%S"
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q bot.py news_quality.py test_news_quality.py
      - name: Run quality tests
        run: python -m unittest -v test_news_quality.py
      - name: Run bot
        run: python bot.py
      - name: Save published IDs
        if: success() && env.DRY_RUN != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update published news history [skip ci]"
            git push
          fi
      # GitHub's cron trigger can be dropped under load. After every successful
      # live run we request the next run ourselves using the built-in token.
      # Manual dry runs do not start the relay.
      - name: Wait until next automatic check
        if: success() && env.DRY_RUN != '1'
        run: |
          echo "Bot run finished. Next check will be requested in 4 minutes."
          sleep 240
      - name: Schedule the next check via GitHub API
        if: success() && env.DRY_RUN != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d '{"ref":"main","inputs":{"dry_run":"false"}}' \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/news.yml/dispatches"; then
              echo "Next automatic run requested (HTTP 204)."
              exit 0
            fi
            echo "Dispatch attempt $attempt failed; retrying..."
            sleep 10
          done
          echo "Could not request next run. Fallback cron remains active."
          exit 1
