name: Telegram news (every 5 minutes)

on:
  # GitHub scheduled workflows are best-effort and may be delayed or skipped.
  # Offset minutes avoid the busiest start-of-hour slot.
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only check feeds, do not publish'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: telegram-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
    steps:
      - name: Log trigger and schedule
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Scheduled expression: ${{ github.event.schedule }}"
          date -u "+Runner UTC: %Y-%m-%d %H:%M:%S"
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q bot.py news_quality.py test_news_quality.py
      - name: Run quality tests
        run: python -m unittest -v test_news_quality.py
      - name: Run bot
        run: python bot.py
      - name: Save published IDs
        if: success() && env.DRY_RUN != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update published news history [skip ci]"
            git push
          fi
